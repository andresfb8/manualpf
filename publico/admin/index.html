<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar el manual · Planet Fitness</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#A4278D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23A4278D'/%3E%3Crect x='19' y='7' width='7' height='7' fill='%23F9F72E'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  .cargando {
    display: grid;
    place-content: center;
    height: 100%;
    font: 500 13px/1.5 "Archivo", system-ui, sans-serif;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #5a5a5a;
    gap: 14px;
    text-align: center;
  }
  .cargando::before {
    content: "";
    width: 28px;
    height: 28px;
    margin: 0 auto;
    border: 3px solid #f0d5ea;
    border-top-color: #a4278d;
    border-radius: 50%;
    animation: girar .8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="cargando">Abriendo el panel</div>
<script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
</body>
</html>
